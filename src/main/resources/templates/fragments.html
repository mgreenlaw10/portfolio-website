<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>

<!-- One project widget. Used by both project sections in index.html. -->
<article th:fragment="card(project, section)" class="card">
    <a th:if="${loggedIn}" class="btn btn-red card-edit"
       th:href="@{/admin/projects/{s}/{id}(s=${section.slug},id=${project.id})}">Edit</a>
    <img th:if="${!#strings.isEmpty(project.image)}" class="card-image"
         th:src="@{${project.image}}" th:alt="${project.title}">
    <div class="card-body">
        <h3 th:text="${project.title}">Project</h3>
        <p th:text="${project.description}">Description</p>
        <a th:if="${!#strings.isEmpty(project.github)}" th:href="${project.github}"
           target="_blank" rel="noopener">View on GitHub</a>
    </div>
</article>

</body>
</html>
