<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title th:text="${project.id == null} ? 'Add project' : 'Edit project'">Edit project</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script th:src="@{/js/image-preview.js}" defer></script>
</head>
<body>
<main class="edit">
    <h1 th:text="${project.id == null} ? 'Add project' : 'Edit project'">Edit project</h1>
    <p class="subtitle" th:text="${section.title}">Section</p>
    <p th:if="${error}" class="error" th:text="${error}">Error</p>

    <form class="edit-form" th:action="@{/admin/projects/{s}(s=${section.slug})}" method="post"
          enctype="multipart/form-data">
        <input type="hidden" name="id" th:value="${project.id}">
        <label class="field">Title
            <input type="text" name="title" th:value="${project.title}" required>
        </label>
        <label class="field">GitHub link
            <input type="url" name="github" th:value="${project.github}" placeholder="https://github.com/...">
        </label>
        <label class="field">Description
            <textarea name="description" rows="5" th:text="${project.description}"></textarea>
        </label>
        <div class="field">
            <span>Image</span>
            <img th:if="${!#strings.isEmpty(project.image)}" class="card-image preview" th:src="@{${project.image}}"
                 alt="Current image">
            <div th:unless="${!#strings.isEmpty(project.image)}" class="card-image placeholder preview">Image</div>
            <input type="file" name="image" accept="image/png,image/jpeg,image/gif,image/webp">
            <small th:if="${project.id != null}">Leave empty to keep the current image.</small>
        </div>
        <div class="form-actions">
            <button type="submit" class="btn">Publish</button>
            <a class="btn btn-secondary" th:href="@{/}">Cancel</a>
        </div>
    </form>
</main>
</body>
</html>
